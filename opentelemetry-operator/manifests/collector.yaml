apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: ot
  annotations:
    app.kubernetes.io/name: ot
spec:
  mode: statefulset
  replicas: 1
  # statefulset-specific fields
  podManagementPolicy: OrderedReady
  terminationGracePeriodSeconds: 600
  volumes:
    - name: collection
  volumeMounts:
    - name: collection
      mountPath: /usr/share/collection
  volumeClaimTemplates:
    - metadata:
        name: collection
        labels:
          test: "true"
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: nfs
        resources:
          requests:
            storage: 1Gi
  # common pod-spec fields
  shareProcessNamespace: true
  enableServiceLinks: true
  # imagePullSecrets: {}
  nodeSelector:
    kubernetes.io/os: linux
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/os
                operator: In
                values:
                  - linux
  # podAnnotations:
  #   pod-annotation1: value1
  #   pod-annotation2: value2
  podDnsConfig:
    nameservers:
      - 192.168.5.4
    searches:
      - breeze-blocks.net
      - svc.cluster.local
      - cluster.local
  initContainers:
    - name: init-echo
      image: mirror.gcr.io/library/alpine:latest
      command: ["sh", "-c", 'echo "init done"']
  additionalContainers:
    - name: alpine
      image: mirror.gcr.io/library/alpine:latest
      command: ["sh", "-c", "while true; do sleep 30; done"]
  config:
    receivers:
      jaeger:
        protocols:
          grpc: {}
    exporters:
      debug: {}
    service:
      pipelines:
        traces:
          receivers: [jaeger]
          exporters: [debug]
